<style>
:root{
  --sb:#13322e; --sb2:#0e2724; --sb-act:#c9a227;
  --acc:#12897a; --acc-d:#0c6a5e; --acc-l:#e4f3f0;
  --bg:#eff3f2; --card:#ffffff; --line:#e0e8e6;
  --tx:#1e332f; --mut:#7b8b87; --mut2:#98a7a3;
  --gr:#2c9e5b; --gr-l:#e8f6ed;
  --or:#c9a227; --or-l:#faf2dd;
  --rd:#d9534f; --rd-l:#fbeceb;
  --vi:#6b64bf; --vi-l:#eeedfa;
  --rad:6px; --sh:0 1px 3px rgba(19,50,46,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* SIDEBAR */
.sb{position:fixed;top:0;left:0;bottom:0;width:242px;background:var(--sb);color:#c3d4d0;display:flex;flex-direction:column;z-index:40}
.sb .logo{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb .logo b{color:#fff;font-size:15px;letter-spacing:.2px;display:block}
.sb .logo span{font-size:11px;color:#849894}
.logo-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(140deg,#dcb943,#a8811a);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;font-family:Georgia,serif}
.sb nav{flex:1;overflow-y:auto;padding:10px 0}
.sb .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#63807b;padding:14px 18px 6px}
.sb a.item{display:flex;align-items:center;gap:11px;padding:9px 18px;font-size:13.5px;color:#bccecb;border-left:3px solid transparent;cursor:pointer}
.sb a.item:hover{background:var(--sb2);color:#fff}
.sb a.item.act{background:var(--sb2);color:#fff;border-left-color:var(--sb-act)}
.sb a.item .cnt{margin-left:auto;background:rgba(255,255,255,.12);border-radius:10px;padding:1px 7px;font-size:11px}
.sb a.item .cnt.warn{background:var(--rd);color:#fff}
.sb .who{padding:12px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#849894}
.sb .who b{display:block;color:#fff;font-size:13px;font-weight:600}

/* TOPBAR */
.main{margin-left:242px;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;max-width:100%;overflow:hidden}
.top .tt{min-width:0;flex:1 1 auto;overflow:hidden}
.top h1{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--mut);margin-left:2px}
.spacer{flex:1}
.rolebox{display:flex;align-items:center;gap:8px;background:var(--acc-l);border:1px solid #c6e3de;border-radius:var(--rad);padding:5px 8px}
.rolebox label{font-size:11px;color:var(--acc-d);text-transform:uppercase;letter-spacing:.5px}
.rolebox select{border:0;background:transparent;font-weight:600;color:var(--acc-d);outline:none;cursor:pointer}
.icobtn{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:var(--rad);display:flex;align-items:center;justify-content:center;color:var(--mut);cursor:pointer;position:relative}
.icobtn:hover{color:var(--acc);border-color:#c6e3de}
.icobtn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;background:var(--rd);border-radius:50%}
.ava{width:34px;height:34px;border-radius:50%;background:var(--vi-l);color:var(--vi);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

/* CONTENT */
.wrap{padding:18px 20px 28px;flex:1}
.row{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1 1 320px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card>.hd h3{font-size:14px;font-weight:600}
.card>.hd .mini{font-size:12px;color:var(--mut)}
.card>.bd{padding:14px}
.card>.bd.tight{padding:0}
.note{background:var(--or-l);border:1px solid #eddfb2;border-radius:var(--rad);padding:11px 13px;font-size:13px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start;color:#6f5a12}
.note svg{width:17px;height:17px;margin-top:1px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:13px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .lb{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi .vl{font-size:23px;font-weight:700;margin-top:6px;letter-spacing:-.4px}
.kpi .df{font-size:12px;margin-top:4px;color:var(--mut)}
.kpi .df.up{color:var(--gr)} .kpi .df.dn{color:var(--rd)}
.kpi .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--acc-l);color:var(--acc)}
.kpi.g .ic{background:var(--gr-l);color:var(--gr)} .kpi.o .ic{background:var(--or-l);color:#a7871a}
.kpi.r .ic{background:var(--rd-l);color:var(--rd)} .kpi.v .ic{background:var(--vi-l);color:var(--vi)}

table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);text-align:left;
   padding:10px 12px;background:#f5f9f8;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
td{padding:11px 12px;border-bottom:1px solid #eef3f2;vertical-align:middle}
tbody tr:hover{background:#f8fbfa}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td .m{color:var(--mut);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}

.bdg{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:20px;white-space:nowrap;font-weight:500}
.bdg.g{background:var(--gr-l);color:#1d7844} .bdg.o{background:var(--or-l);color:#8a6f10}
.bdg.r{background:var(--rd-l);color:#a83a37} .bdg.b{background:var(--acc-l);color:var(--acc-d)}
.bdg.v{background:var(--vi-l);color:var(--vi)} .bdg.n{background:#eef3f2;color:var(--mut)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--acc);background:var(--acc);color:#fff;
  padding:8px 14px;border-radius:var(--rad);cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover{background:var(--acc-d);border-color:var(--acc-d)}
.btn.gh{background:#fff;color:var(--tx);border-color:var(--line)}
.btn.gh:hover{background:#f4f8f7;color:var(--acc);border-color:#c6e3de}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.gr{background:var(--gr);border-color:var(--gr)} .btn.gr:hover{background:#238049;border-color:#238049}
.btn.gd{background:var(--or);border-color:var(--or)} .btn.gd:hover{background:#ab8a1c;border-color:#ab8a1c}
.btn svg{width:16px;height:16px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.inp{border:1px solid var(--line);background:#fff;border-radius:var(--rad);padding:8px 11px;outline:none;min-width:0;max-width:100%}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(18,137,122,.13)}
select.inp{cursor:pointer}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.field .inp{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .b i{display:block;width:100%;max-width:34px;background:linear-gradient(180deg,#46b5a5,var(--acc));border-radius:3px 3px 0 0}
.bars .b i.alt{background:linear-gradient(180deg,#e0c665,var(--or))}
.bars .b span{font-size:11px;color:var(--mut)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:10px}
.leg i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px}

.pipe{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pipe .st{flex:1 0 190px;background:#f5f9f8;border:1px solid var(--line);border-radius:var(--rad);padding:10px}
.pipe .st>h4{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);display:flex;justify-content:space-between;margin-bottom:9px}
.pipe .cd{background:#fff;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:4px;padding:9px 10px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer}
.pipe .cd b{font-size:13px;display:block}
.pipe .cd .m{font-size:11.5px;color:var(--mut);margin-top:3px}
.pipe .cd.warn{border-left-color:var(--or)} .pipe .cd.done{border-left-color:var(--gr)} .pipe .cd.lost{border-left-color:var(--rd)}

.list .it{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid #eef3f2}
.list .it:last-child{border-bottom:0}
.list .it .ic{width:34px;height:34px;border-radius:8px;background:var(--acc-l);color:var(--acc);display:flex;align-items:center;justify-content:center}
.list .it .ic.o{background:var(--or-l);color:#a7871a} .list .it .ic.r{background:var(--rd-l);color:var(--rd)}
.list .it .ic.g{background:var(--gr-l);color:var(--gr)} .list .it .ic.v{background:var(--vi-l);color:var(--vi)}
.list .it .tx b{display:block;font-size:13.5px}
.list .it .tx span{font-size:12px;color:var(--mut)}
.list .it .rt{margin-left:auto;text-align:right;white-space:nowrap}

.prog{height:7px;background:#eef3f2;border-radius:5px;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:5px}
.prog i.g{background:var(--gr)} .prog i.o{background:var(--or)} .prog i.r{background:var(--rd)}

.empty{padding:34px 16px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--tx);margin-bottom:4px}

/* ШАХМАТКА */
.grid-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.shah{border-collapse:separate;border-spacing:0;min-width:720px}
.shah th{position:sticky;top:0;z-index:2}
.shah td.rm,.shah th.rm{position:sticky;left:0;background:#fff;z-index:3;border-right:1px solid var(--line);min-width:120px}
.shah th.rm{background:#f5f9f8;z-index:4}
.shah td{padding:0;height:38px;border-bottom:1px solid #eef3f2;border-right:1px solid #f2f6f5}
.cell{height:36px;margin:1px;border-radius:4px;display:flex;align-items:center;padding:0 7px;font-size:11.5px;color:#fff;white-space:nowrap;overflow:hidden;cursor:pointer}
.cell.free{background:#f5f9f8;color:var(--mut2);border:1px dashed #dbe5e3;justify-content:center}
.cell.occ{background:var(--acc)} .cell.res{background:#6b64bf} .cell.out{background:var(--or);color:#3d3105}
.cell.cln{background:#c9d4d1;color:#54635f} .cell.blk{background:var(--rd)}

/* КАЛЕНДАРЬ ПРОЦЕДУР */
.tl{display:flex;gap:0;font-size:11px;min-width:640px}
.tl .h{flex:0 0 118px}
.tl .slot{flex:1;text-align:center;color:var(--mut);border-left:1px solid var(--line);padding:5px 0}
.tlrow{display:flex;min-width:640px;border-top:1px solid var(--line);align-items:stretch}
.tlrow .h{flex:0 0 118px;padding:9px;font-size:12.5px;display:flex;flex-direction:column;justify-content:center;background:#f5f9f8}
.tlrow .h span{font-size:11px;color:var(--mut)}
.tlrow .lane{flex:1;border-left:1px solid var(--line);padding:3px;min-height:46px}
.chip{background:var(--acc-l);border:1px solid #bfe0da;border-left:3px solid var(--acc);border-radius:4px;padding:4px 6px;font-size:11.5px;cursor:pointer;line-height:1.3}
.chip b{display:block;font-size:11.5px}
.chip span{color:var(--mut);font-size:10.5px}
.chip.o{background:var(--or-l);border-color:#e8d59a;border-left-color:var(--or)}
.chip.g{background:var(--gr-l);border-color:#bfe4cc;border-left-color:var(--gr)}
.chip.v{background:var(--vi-l);border-color:#cfcbef;border-left-color:var(--vi)}

/* КАРТОЧКИ ГОСТЯ / ДОСТАВКИ */
.dcard{border:1px solid var(--line);border-radius:var(--rad);padding:13px;margin-bottom:11px;background:#fff;box-shadow:var(--sh)}
.dcard .t{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.dcard .t b{font-size:14.5px}
.dcard .adr{font-size:13px;color:var(--mut);display:flex;gap:7px;align-items:flex-start;margin-bottom:9px}
.dcard .ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-top:1px dashed var(--line)}
.dcard .acts{display:flex;gap:8px;margin-top:11px}
.dcard .acts .btn{flex:1;justify-content:center}

/* MODAL & SHEET */
.ov{position:fixed;inset:0;background:rgba(15,35,32,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.mdl{background:#fff;border-radius:8px;width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mdl .h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.mdl .h h3{font-size:15px;font-weight:600;flex:1}
.mdl .b{padding:16px}
.mdl .f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:#f5f9f8;position:sticky;bottom:0}
.x{border:0;background:transparent;color:var(--mut);cursor:pointer;padding:4px}
.drop{border:1.5px dashed #c5d5d1;border-radius:var(--rad);padding:18px;text-align:center;color:var(--mut);font-size:13px;cursor:pointer;background:#fafcfb}
.drop:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-l)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#1e332f;color:#fff;padding:11px 18px;border-radius:22px;font-size:13.5px;z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;bottom:100px}

/* MOBILE */
.bnav{display:none}
@media(max-width:900px){
  .sb{display:none}
  .main{margin-left:0}
  .top{padding:0 12px;height:52px}
  .top h1{font-size:15.5px}
  .top .sub{display:none}
  .rolebox label{display:none}
  .wrap{padding:12px 12px calc(78px + env(safe-area-inset-bottom));max-width:100vw;overflow-x:hidden}
  .row{gap:0}
  .col{flex:1 1 100%}
  .card,.kpi{max-width:100%}
  .filters{gap:7px}
  .filters .inp{flex:1 1 100%;width:100%}
  .filters .btn{flex:1 1 100%;justify-content:center}
  .rolebox{padding:4px 6px}
  .rolebox select{max-width:126px}
  .kpi .lb{font-size:10.5px}
  .kpi .df{font-size:11px}
  .bars{height:120px;gap:4px}
  .bars .b span{font-size:9.5px}
  .card>.hd{padding:11px 12px;flex-wrap:wrap}
  .card>.hd h3{font-size:13.5px}
  .card>.bd{padding:12px}
  .pipe{gap:8px}
  .pipe .st{flex:0 0 78%}
  .dcard .acts{flex-wrap:wrap}
  .dcard .ln b{text-align:right;overflow-wrap:anywhere}
  .list .it{padding:10px 12px}
  .list .it .tx{min-width:0}
  .list .it .tx b,.list .it .tx span{overflow-wrap:anywhere}
  .leg{flex-wrap:wrap;gap:8px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:9px}
  .kpi .vl{font-size:18px;overflow-wrap:anywhere} .kpi .ic{display:none}
  .f2{grid-template-columns:1fr}
  th,td{padding:9px 10px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;
    border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 12px rgba(19,50,46,.08)}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut2);font-size:10.5px;padding:4px 2px;cursor:pointer;position:relative}
  .bnav a.act{color:var(--acc)}
  .bnav a svg{width:22px;height:22px}
  .bnav a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bnav a .cnt{position:absolute;top:0;right:50%;margin-right:-20px;background:var(--rd);color:#fff;font-size:9.5px;border-radius:9px;padding:0 5px;line-height:15px}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:14px 14px 0 0;z-index:70;
    transform:translateY(102%);transition:.24s;padding-bottom:calc(14px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
  .sheet.on{transform:translateY(0)}
  .sheet .gr{width:38px;height:4px;background:#d8e2df;border-radius:3px;margin:9px auto 4px}
  .sheet .st{padding:12px 16px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
  .sheet a{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #f0f4f3;font-size:14.5px}
  .sheet a .ic{color:var(--acc)}
  .sheet a .cnt{margin-left:auto;background:var(--rd);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px}
  .mdl{max-width:100%;border-radius:12px}
  .hide-m{display:none!important}
}
@media(min-width:901px){ .sheet{display:none} .only-m{display:none!important} }
</style>
</head>
<body>

<aside class="sb">

let role='boss', page='dash';

function render(){
  const r=NAV[role];
  document.getElementById('sbnav').innerHTML = r.items.map(it=>
    (it.g?`<div class="grp">${it.g}</div>`:'')+
    `<a class="item ${page===it.k?'act':''}" onclick="go('${it.k}')">${ic(it.i)}<span>${it.t}</span>${it.c?`<span class="cnt">${it.c}</span>`:''}</a>`).join('');
  document.getElementById('sbwho').innerHTML=`<b>${r.name}</b>${r.pos}`;
  document.getElementById('ava').textContent=r.ini;
  document.getElementById('pgTitle').textContent=TITLES[page]||'';
  document.getElementById('pgSub').textContent=SUBS[page]||'';
  document.getElementById('content').innerHTML=(P[page]||(()=>'<div class="card"><div class="empty"><b>Раздел в макете не раскрыт</b>Выберите другой пункт меню</div></div>'))();
  const rest=r.items.filter(it=>!r.bottom.includes(it.k));
  const bn=r.bottom.map(k=>{const it=r.items.find(x=>x.k===k);
    return `<a class="${page===k?'act':''}" onclick="go('${k}')">${ic(it.i)}<span>${it.t.split(' ')[0]}</span>${it.c?`<span class="cnt">${it.c}</span>`:''}</a>`}).join('');
  document.getElementById('bnav').innerHTML=bn+(rest.length?
    `<a onclick="openSheet()" class="${r.bottom.includes(page)?'':'act'}">${ic('more')}<span>Ещё</span></a>`:'');
  document.getElementById('sheetTitle').textContent=`Ещё разделы · ${rest.length}`;
  document.getElementById('sheetItems').innerHTML=rest.map(it=>
    `<a onclick="go('${it.k}');closeSheet()"><span class="ic">${ic(it.i)}</span>${it.t}${it.c?`<span class="cnt">${it.c}</span>`:''}</a>`).join('');
  if(!rest.length)closeSheet();
  window.scrollTo(0,0);
}
function go(k){page=k;render()}
function setRole(v){role=v;page=NAV[v].items[0].k;render();toast('Вход как: '+NAV[v].pos)}
function openSheet(){document.getElementById('sheet').classList.add('on');document.getElementById('sheetOv').classList.add('on')}
function closeSheet(){document.getElementById('sheet').classList.remove('on');document.getElementById('sheetOv').classList.remove('on')}

/* ==================== МОДАЛКИ ==================== */
let saveFn=null;
function modal(title,body,fn,btn='Сохранить'){
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').innerHTML=body;
  document.getElementById('mSave').innerHTML=btn;
  saveFn=fn;document.getElementById('modalOv').classList.add('on');
}
function closeModal(){document.getElementById('modalOv').classList.remove('on')}
function saveModal(){if(saveFn)saveFn();closeModal()}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2600)}
